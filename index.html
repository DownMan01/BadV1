<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bad Vibes Socials</title>
  <meta name="theme-color" content="#050505">

  <meta property="og:image" content="./img/profile.png">
  <link rel="icon" type="image/x-icon" href="./img/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

  <style>
    /* --- CSS Reset --- */
    :root {
      --bg: #050505;
      --card-bg: rgba(20, 20, 20, 0.8);
      --item-bg: rgba(255, 255, 255, 0.05);
      --item-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: #fff;
      /* Grid is better for perfect centering + scrolling safety */
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* --- Background Game Canvas --- */
    canvas#game-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: auto; /* Allows clicking canvas */
    }

    /* --- Main Container --- */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      /* Ensures padding on mobile */
      padding: 2rem 1rem; 
      display: flex;
      justify-content: center;
    }

    /* --- The Card --- */
    .profile-card {
      width: 100%;
      max-width: 400px; /* Strict width control */
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 8px; /* Inner gap frame */
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Header Section --- */
    .card-inner {
      background: #111;
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    /* Noise Texture Overlay */
    .card-inner::after {
        content: ""; position: absolute; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        opacity: 0.4; pointer-events: none;
    }

    .profile-img {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 3px solid #1a1a1a;
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
      object-fit: cover;
      margin-bottom: 1rem;
      position: relative; z-index: 2;
    }

    .name-row {
        display: flex; align-items: center; justify-content: center; gap: 6px;
        position: relative; z-index: 2;
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .verified { color: var(--accent); font-size: 1rem; }
    
    .bio {
      color: #888; font-size: 0.9rem; font-weight: 500; margin-top: 4px;
      position: relative; z-index: 2;
    }

    /* --- Links Grid --- */
    .links-stack {
      display: flex; flex-direction: column; gap: 8px;
    }

    .link-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: var(--item-bg);
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .left-content { display: flex; align-items: center; gap: 14px; }
    
    .icon {
        width: 36px; height: 36px;
        background: rgba(255,255,255,0.08);
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem;
        transition: 0.2s;
    }

    .label { font-weight: 600; font-size: 0.95rem; }
    .arrow { color: #555; font-size: 0.8rem; transition: 0.2s; }

    /* Hover Effects */
    .link-btn:hover {
        background: var(--item-hover);
        transform: scale(1.02);
        border-color: rgba(255,255,255,0.1);
    }
    .link-btn:hover .arrow { color: #fff; transform: translateX(3px); }
    
    /* Brand Colors (Icon fills on hover) */
    .link-btn:hover .icon.fb { background: #1877F2; }
    .link-btn:hover .icon.yt { background: #FF0000; }
    .link-btn:hover .icon.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .link-btn:hover .icon.tw { background: #fff; color: #000; }
    .link-btn:hover .icon.tt { background: #00f2ea; color: #000; }

    /* --- Floating Badge --- */
    .interactive-badge {
        position: fixed; bottom: 20px;
        background: rgba(10,10,10,0.8);
        border: 1px solid #333;
        padding: 8px 16px;
        border-radius: 50px;
        font-size: 0.8rem; color: #888;
        display: flex; align-items: center; gap: 8px;
        backdrop-filter: blur(5px);
        z-index: 5;
    }
    .key { background: #333; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold;}

  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <main>
    <div class="profile-card" data-tilt data-tilt-max="2" data-tilt-speed="400">
      
      <div class="card-inner">
        <img src="./img/profile.png" alt="Profile" class="profile-img">
        <div class="name-row">
            <h1>Bad Vibes</h1>
            <i class="fa-solid fa-circle-check verified"></i>
        </div>
        <p class="bio">Digital Creator • Social Hub</p>
      </div>

      <div class="links-stack">
        <a href="https://www.facebook.com/badvibeph/" target="_blank" class="link-btn">
          <div class="left-content">
            <div class="icon fb"><i class="fa-brands fa-facebook-f"></i></div>
            <span class="label">Facebook</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow"></i>
        </a>

        <a href="https://www.youtube.com/badvibesph/" target="_blank" class="link-btn">
          <div class="left-content">
            <div class="icon yt"><i class="fa-brands fa-youtube"></i></div>
            <span class="label">YouTube</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow"></i>
        </a>

        <a href="https://www.instagram.com/badvibesph/" target="_blank" class="link-btn">
          <div class="left-content">
            <div class="icon ig"><i class="fa-brands fa-instagram"></i></div>
            <span class="label">Instagram</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow"></i>
        </a>

        <a href="https://twitter.com/itsbadvibesph/" target="_blank" class="link-btn">
          <div class="left-content">
            <div class="icon tw"><i class="fa-brands fa-x-twitter"></i></div>
            <span class="label">Twitter / X</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow"></i>
        </a>

        <a href="https://www.tiktok.com/@itsbadvibes/" target="_blank" class="link-btn">
          <div class="left-content">
            <div class="icon tt"><i class="fa-brands fa-tiktok"></i></div>
            <span class="label">TikTok</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow"></i>
        </a>
      </div>

    </div>
  </main>

  <div class="interactive-badge">
    <span class="key">CLICK BG</span>
    <span>to scare snakes</span>
  </div>

  <script>
    // --- 1. Tilt Initialization ---
    VanillaTilt.init(document.querySelector(".profile-card"));

    // --- 2. Advanced Snake Engine ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let isBoosting = false;

    // Snake Config
    const SNAKE_COUNT = 8;
    const COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ffffff'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Listeners
    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.addEventListener('mousedown', () => isBoosting = true);
    document.addEventListener('mouseup', () => isBoosting = false);
    document.addEventListener('touchstart', () => isBoosting = true);
    document.addEventListener('touchend', () => isBoosting = false);

    // Shockwave Event
    document.addEventListener('click', (e) => {
        // Prevent triggering if clicking a link
        if(e.target.closest('a')) return;
        
        createShockwave(e.clientX, e.clientY);
    });

    function createShockwave(x, y) {
        snakes.forEach(snake => {
            const head = snake.segments[0];
            const dx = head.x - x;
            const dy = head.y - y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // If snake is close to click, force it away instantly
            if(dist < 300) {
                const angleAway = Math.atan2(dy, dx);
                snake.targetAngle = angleAway;
                snake.angle = angleAway; // Snap angle
                snake.forceSpeed = 10; // Temp speed burst
            }
        });
    }

    // --- SNAKE CLASS ---
    class Snake {
      constructor() {
        this.reset();
        this.segments.forEach(s => { s.x = Math.random() * width; s.y = Math.random() * height; });
      }

      reset() {
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        this.baseSpeed = 2 + Math.random();
        this.forceSpeed = 0; // For shockwaves
        this.turnSpeed = 0.05;
        this.radius = 5;
        this.length = 25 + Math.floor(Math.random() * 20);
        this.segments = [];
        for(let i=0; i<this.length; i++) { this.segments.push({x:0, y:0}); }
      }

      update() {
        // 1. AI Logic
        if (this.forceSpeed > 0) {
            // Decelerate from shockwave
            this.forceSpeed *= 0.95;
            if(this.forceSpeed < 0.1) this.forceSpeed = 0;
        } else {
            // Normal Wandering
            this.targetAngle += (Math.random() - 0.5) * 0.3;
        }

        // 2. Rotation
        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * this.turnSpeed;

        // 3. Movement
        let currentSpeed = (isBoosting ? this.baseSpeed * 2.5 : this.baseSpeed) + this.forceSpeed;
        
        let vx = Math.cos(this.angle) * currentSpeed;
        let vy = Math.sin(this.angle) * currentSpeed;

        let nextX = this.segments[0].x + vx;
        let nextY = this.segments[0].y + vy;

        // 4. Wrap Screen
        if (nextX < 0) nextX = width; if (nextX > width) nextX = 0;
        if (nextY < 0) nextY = height; if (nextY > height) nextY = 0;

        this.segments.unshift({x: nextX, y: nextY});
        if (this.segments.length > this.length) this.segments.pop();
      }

      draw() {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = this.radius * 2;
        ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.strokeStyle = this.color;

        ctx.beginPath();
        if(this.segments.length > 0) ctx.moveTo(this.segments[0].x, this.segments[0].y);
        
        for (let i = 1; i < this.segments.length; i++) {
          const curr = this.segments[i]; const prev = this.segments[i-1];
          // Fix wrapping glitches
          if (Math.abs(curr.x - prev.x) + Math.abs(curr.y - prev.y) > 100) {
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(curr.x, curr.y);
          } else { ctx.lineTo(curr.x, curr.y); }
        }
        ctx.stroke(); 
        
        // --- EYES (Interactive!) ---
        ctx.shadowBlur = 0;
        const head = this.segments[0];
        
        // Calculate angle to mouse for eyes
        const dx = mouseX - head.x;
        const dy = mouseY - head.y;
        let eyeAngle = Math.atan2(dy, dx);
        
        // If mouse is too far or wrapping, default to head direction
        // if(Math.sqrt(dx*dx + dy*dy) > 400) eyeAngle = this.angle; 

        // Draw Eye Whites
        ctx.fillStyle = 'white';
        const leftEyeX = head.x + Math.cos(this.angle - 0.7) * (this.radius * 0.8);
        const leftEyeY = head.y + Math.sin(this.angle - 0.7) * (this.radius * 0.8);
        const rightEyeX = head.x + Math.cos(this.angle + 0.7) * (this.radius * 0.8);
        const rightEyeY = head.y + Math.sin(this.angle + 0.7) * (this.radius * 0.8);

        ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, 3, 0, Math.PI*2); ctx.fill();

        // Draw Pupils (Look at mouse)
        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(leftEyeX + Math.cos(eyeAngle)*1, leftEyeY + Math.sin(eyeAngle)*1, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(rightEyeX + Math.cos(eyeAngle)*1, rightEyeY + Math.sin(eyeAngle)*1, 1.5, 0, Math.PI*2); ctx.fill();
      }
    }

    const snakes = Array.from({length: SNAKE_COUNT}, () => new Snake());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      snakes.forEach(s => { s.update(); s.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

  </script>
</body>
</html>
