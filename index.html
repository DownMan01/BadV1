<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bad Vibes Socials</title>
  <meta name="theme-color" content="#000000">

  <meta property="og:image" content="./img/profile.png">
  <link rel="icon" type="image/x-icon" href="./img/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

  <style>
    :root {
      --bg: #050505;
      /* Elegant Theme Variables */
      --card-glass: rgba(20, 20, 20, 0.6);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
      --btn-bg: rgba(255, 255, 255, 0.03);
      --btn-hover: rgba(255, 255, 255, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* --- Background Game Canvas --- */
    canvas#game-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      /* Very subtle noise texture over the black bg */
      opacity: 0.8; 
    }

    /* --- Main Layout --- */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }

    /* --- Elegant Glass Card --- */
    .glass-card {
      width: 100%;
      max-width: 400px;
      /* High blur for premium feel */
      background: var(--card-glass);
      backdrop-filter: blur(40px) saturate(110%);
      -webkit-backdrop-filter: blur(40px) saturate(110%);
      /* Thin, subtle border */
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      
      opacity: 0;
      transform: translateY(20px);
      animation: softEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes softEntrance {
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Profile --- */
    .profile-section {
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .img-wrapper {
      width: 100px; height: 100px;
      margin-bottom: 1rem;
      border-radius: 50%;
      padding: 3px;
      /* Subtle gradient ring */
      background: linear-gradient(to bottom right, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
    }

    .profile-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      color: #fff;
    }

    .bio {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* --- Minimalist Buttons --- */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .clean-btn {
      display: flex;
      align-items: center;
      /* Justify between to separate text and arrow if needed, but centering is cleaner */
      justify-content: center; 
      position: relative;
      width: 100%;
      padding: 16px;
      background: var(--btn-bg);
      border-radius: 18px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 400;
      transition: all 0.3s ease;
    }

    .clean-btn i {
      position: absolute;
      left: 20px;
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    .clean-btn span {
      z-index: 2;
    }

    /* Hover Effect: Simple Scale & Lighten */
    .clean-btn:hover {
      background: var(--btn-hover);
      transform: scale(1.02);
    }
    .clean-btn:hover i {
      color: #fff;
    }

    /* Small brand accents only on hover */
    .fb:hover { color: #1877F2; }
    .yt:hover { color: #FF0000; }
    .ig:hover { color: #E1306C; }
    .tw:hover { color: #1DA1F2; }
    .tt:hover { color: #00f2ea; }

    /* --- Score Pill --- */
    .score-pill {
        position: fixed;
        bottom: 25px;
        background: rgba(30,30,30,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 8px 16px;
        border-radius: 100px;
        font-size: 0.8rem;
        color: var(--text-muted);
        backdrop-filter: blur(10px);
        z-index: 20;
    }
    .score-pill span { color: #fff; font-weight: 600; margin-left: 5px; }

    @media(max-width: 480px) {
      .glass-card { padding: 2.5rem 1.5rem; }
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <main>
    <div class="glass-card" data-tilt data-tilt-max="3" data-tilt-glare data-tilt-max-glare="0.05">
      
      <div class="profile-section">
        <div class="img-wrapper">
          <img src="./img/profile.png" alt="Profile" class="profile-img">
        </div>
        <h1>Bad Vibes</h1>
        <p class="bio">Digital Creator</p>
      </header>

      <div class="link-list">
        <a href="https://www.facebook.com/badvibeph/" target="_blank" class="clean-btn fb">
          <i class="fa-brands fa-facebook-f"></i>
          <span>Facebook</span>
        </a>
        <a href="https://www.youtube.com/badvibesph/" target="_blank" class="clean-btn yt">
          <i class="fa-brands fa-youtube"></i>
          <span>YouTube</span>
        </a>
        <a href="https://www.instagram.com/badvibesph/" target="_blank" class="clean-btn ig">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a href="https://twitter.com/itsbadvibesph/" target="_blank" class="clean-btn tw">
          <i class="fa-brands fa-x-twitter"></i>
          <span>Twitter</span>
        </a>
        <a href="https://www.tiktok.com/@itsbadvibes/" target="_blank" class="clean-btn tt">
          <i class="fa-brands fa-tiktok"></i>
          <span>TikTok</span>
        </a>
      </div>

    </div>
  </main>

  <div class="score-pill">
    Energy Collected <span id="score">0</span>
  </div>

  <script>
    // --- Tilt Init ---
    VanillaTilt.init(document.querySelector(".glass-card"), {
        speed: 800,
        perspective: 1000,
        scale: 1.01
    });

    // --- GAME ENGINE (Snakes & Food) ---
    // (Kept exactly the same as previous request, just rendering on the background)
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    
    let width, height, mouseX = -1000, mouseY = -1000;
    let totalFoodEaten = 0;

    // SNAKE CONFIG
    const SNAKE_COUNT = 5; // Reduced slightly for cleaner aesthetic
    const FOOD_COUNT = 15;
    // Muted Neon Colors for Elegance
    const COLORS = ['#00f2ea', '#ff0050', '#7000ff', '#ffffff'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize); resize();
    window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

    class Food {
        constructor() { this.respawn(); }
        respawn() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = 2 + Math.random() * 2; // Smaller dots
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }
        draw() {
            ctx.shadowBlur = 10; ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    class Snake {
      constructor() {
        this.reset();
        this.segments.forEach(s => { s.x = Math.random() * width; s.y = Math.random() * height; });
      }
      reset() {
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        this.speed = 2 + Math.random();
        this.turnSpeed = 0.04;
        this.radius = 3 + Math.random() * 3; // Thinner snakes
        this.targetLength = 30 + Math.floor(Math.random() * 30);
        this.segments = [];
        for(let i=0; i<this.targetLength; i++) { this.segments.push({x:0, y:0}); }
      }
      grow() { this.targetLength += 10; }
      update(foodArray) {
        this.targetAngle += (Math.random() - 0.5) * 0.2; // Gentler wandering
        const head = this.segments[0];
        // Avoid Mouse
        const dxM = head.x - mouseX; const dyM = head.y - mouseY;
        if(Math.sqrt(dxM*dxM + dyM*dyM) < 150) { this.targetAngle = Math.atan2(dyM, dxM); }

        // Rotation
        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * this.turnSpeed;

        // Move
        let nextX = head.x + Math.cos(this.angle) * this.speed;
        let nextY = head.y + Math.sin(this.angle) * this.speed;

        if (nextX < 0) nextX = width; if (nextX > width) nextX = 0;
        if (nextY < 0) nextY = height; if (nextY > height) nextY = 0;

        this.segments.unshift({x: nextX, y: nextY});

        // Eat Food
        for(let i = 0; i < foodArray.length; i++) {
            const f = foodArray[i];
            const dist = Math.hypot(head.x - f.x, head.y - f.y);
            if(dist < this.radius + f.size + 10) {
                f.respawn(); this.grow(); totalFoodEaten++; scoreEl.innerText = totalFoodEaten;
            }
        }
        if (this.segments.length > this.targetLength) this.segments.pop();
      }
      draw() {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = this.radius * 2;
        ctx.shadowBlur = 15; ctx.shadowColor = this.color; ctx.strokeStyle = this.color;
        ctx.beginPath();
        if(this.segments.length > 0) ctx.moveTo(this.segments[0].x, this.segments[0].y);
        for (let i = 1; i < this.segments.length; i++) {
          const curr = this.segments[i]; const prev = this.segments[i-1];
          if (Math.abs(curr.x - prev.x) + Math.abs(curr.y - prev.y) > 100) {
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(curr.x, curr.y);
          } else { ctx.lineTo(curr.x, curr.y); }
        }
        ctx.stroke(); ctx.shadowBlur = 0;
      }
    }

    const snakes = Array.from({length: SNAKE_COUNT}, () => new Snake());
    const foods = Array.from({length: FOOD_COUNT}, () => new Food());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      foods.forEach(f => f.draw());
      snakes.forEach(s => { s.update(foods); s.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
