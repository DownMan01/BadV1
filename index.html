<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bad Vibes Socials - Universe Edition</title>
  <meta name="theme-color" content="#050505">

  <meta property="og:image" content="./img/profile.png">
  <link rel="icon" type="image/x-icon" href="./img/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

  <style>
    /* --- CSS Reset & Variables --- */
    :root {
      --bg-dark: #020204;
      --bg-light: #111b2b;
      --card-bg: rgba(20, 20, 25, 0.75);
      --item-bg: rgba(255, 255, 255, 0.05);
      --item-hover: rgba(255, 255, 255, 0.12);
      --accent-glow: rgba(0, 242, 234, 0.5);
      --accent-border: rgba(0, 242, 234, 0.3);
      --accent-blue: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(ellipse at bottom, var(--bg-light) 0%, var(--bg-dark) 100%);
      color: #fff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background-attachment: fixed;
      cursor: crosshair; /* Indicates interactive background */
    }

    /* Stars Overlay */
    body::before {
        content: ""; position: fixed; inset: 0;
        background-image: 
            radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 1px),
            radial-gradient(white, rgba(255,255,255,.05) 1px, transparent 1px);
        background-size: 250px 250px, 150px 150px;
        opacity: 0.3; pointer-events: none;
    }

    canvas#game-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: auto;
    }

    main {
      position: relative; z-index: 10; width: 100%;
      padding: 2rem 1rem; display: flex; justify-content: center;
      padding-bottom: 100px;
    }

    /* --- Glowing Profile Card --- */
    .profile-card {
      width: 100%; max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-radius: 28px; padding: 8px;
      border: 1px solid var(--accent-border);
      box-shadow: 
        0 0 20px var(--accent-glow), 
        0 0 60px rgba(0, 242, 234, 0.1), 
        0 30px 60px -12px rgba(0, 0, 0, 0.8);
      opacity: 0; transform: translateY(20px);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); }}

    .card-inner {
      background: rgba(10, 10, 15, 0.6);
      border-radius: 20px; padding: 2rem; text-align: center;
      margin-bottom: 8px; position: relative; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .profile-img {
      width: 100px; height: 100px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 20px rgba(0, 242, 234, 0.2);
      object-fit: cover; margin-bottom: 1rem; position: relative; z-index: 2;
    }

    .name-row { display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; z-index: 2; }
    h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .verified { color: var(--accent-blue); font-size: 1rem; }
    .bio { color: #aaa; font-size: 0.9rem; font-weight: 500; margin-top: 4px; position: relative; z-index: 2; }

    /* --- Links --- */
    .links-stack { display: flex; flex-direction: column; gap: 8px; }

    .link-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: var(--item-bg);
      border-radius: 16px; text-decoration: none; color: #fff;
      transition: all 0.2s ease; border: 1px solid transparent;
    }

    .left-content { display: flex; align-items: center; gap: 14px; }
    .icon {
        width: 36px; height: 36px; background: rgba(255,255,255,0.08);
        border-radius: 10px; display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem; transition: 0.2s;
    }
    .label { font-weight: 600; font-size: 0.95rem; }
    .arrow { color: #555; font-size: 0.8rem; transition: 0.2s; }

    .link-btn:hover { background: var(--item-hover); transform: scale(1.02); border-color: rgba(255,255,255,0.1); }
    .link-btn:hover .arrow { color: #fff; transform: translateX(3px); }
    .link-btn:hover .icon.fb { background: #1877F2; }
    .link-btn:hover .icon.yt { background: #FF0000; }
    .link-btn:hover .icon.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .link-btn:hover .icon.tw { background: #fff; color: #000; }
    .link-btn:hover .icon.tt { background: #00f2ea; color: #000; }

    /* --- Bottom UI --- */
    .bottom-ui {
        position: fixed; bottom: 30px; left: 0; width: 100%;
        display: flex; justify-content: space-between;
        padding: 0 30px; z-index: 20; pointer-events: none;
    }

    .hint-badge {
        background: rgba(10,10,15,0.7);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 10px 16px; border-radius: 50px;
        font-size: 0.8rem; color: #aaa;
        display: flex; align-items: center; gap: 8px;
        backdrop-filter: blur(10px); pointer-events: auto;
    }
    .key { background: rgba(255,255,255,0.15); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold;}

    .spawn-btn {
        pointer-events: auto;
        background: linear-gradient(135deg, #00f2ea, #3b82f6);
        border: none; color: #000; font-weight: 700;
        padding: 12px 24px; border-radius: 50px;
        cursor: pointer; display: flex; align-items: center; gap: 8px;
        box-shadow: 0 0 20px rgba(0, 242, 234, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .spawn-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 242, 234, 0.6); }
    .spawn-btn:active { transform: scale(0.95); }

    @media(max-width: 600px) {
        .bottom-ui { flex-direction: column-reverse; align-items: center; gap: 20px; bottom: 20px;}
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <main>
    <div class="profile-card" data-tilt data-tilt-max="3" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.15">
      <div class="card-inner">
        <img src="./img/profile.png" alt="Profile" class="profile-img">
        <div class="name-row">
            <h1>Bad Vibes</h1>
            <i class="fa-solid fa-circle-check verified"></i>
        </div>
        <p class="bio">Digital Creator</p>
      </div>

      <div class="links-stack">
        <a href="https://www.facebook.com/badvibeph/" target="_blank" class="link-btn"><div class="left-content"><div class="icon fb"><i class="fa-brands fa-facebook-f"></i></div><span class="label">Facebook</span></div><i class="fa-solid fa-chevron-right arrow"></i></a>
        <a href="https://www.youtube.com/badvibesph/" target="_blank" class="link-btn"><div class="left-content"><div class="icon yt"><i class="fa-brands fa-youtube"></i></div><span class="label">YouTube</span></div><i class="fa-solid fa-chevron-right arrow"></i></a>
        <a href="https://www.instagram.com/badvibesph/" target="_blank" class="link-btn"><div class="left-content"><div class="icon ig"><i class="fa-brands fa-instagram"></i></div><span class="label">Instagram</span></div><i class="fa-solid fa-chevron-right arrow"></i></a>
        <a href="https://twitter.com/itsbadvibesph/" target="_blank" class="link-btn"><div class="left-content"><div class="icon tw"><i class="fa-brands fa-x-twitter"></i></div><span class="label">Twitter / X</span></div><i class="fa-solid fa-chevron-right arrow"></i></a>
        <a href="https://www.tiktok.com/@itsbadvibes/" target="_blank" class="link-btn"><div class="left-content"><div class="icon tt"><i class="fa-brands fa-tiktok"></i></div><span class="label">TikTok</span></div><i class="fa-solid fa-chevron-right arrow"></i></a>
      </div>
    </div>
  </main>

  <div class="bottom-ui">
      <div class="hint-badge">
        <span class="key">HOLD</span>
        <span>to Boost Speed</span>
      </div>
      <button class="spawn-btn" id="spawnBtn">
        <i class="fa-solid fa-gamepad"></i> Play Snake
      </button>
  </div>

  <script>
    VanillaTilt.init(document.querySelector(".profile-card"));

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    // Global State
    let width, height, mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let isBoosting = false;
    let playerSnake = null; // Track the single player snake

    const SNAKE_COUNT = 5;
    const FOOD_COUNT = 15;
    const COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6'];
    const PLAYER_COLOR = '#00f2ea'; // Cyan for player

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize); resize();

    // Input Handling
    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    
    // Boost Logic
    document.addEventListener('mousedown', () => isBoosting = true);
    document.addEventListener('mouseup', () => isBoosting = false);
    document.addEventListener('touchstart', () => isBoosting = true);
    document.addEventListener('touchend', () => isBoosting = false);

    // Shockwave (Only scares AI)
    document.addEventListener('click', (e) => {
        if(e.target.closest('a, button')) return;
        snakes.forEach(snake => {
            if(!snake.isPlayer) { // Only scare AI snakes
                const head = snake.segments[0];
                const dist = Math.hypot(head.x - e.clientX, head.y - e.clientY);
                if(dist < 300) {
                    snake.targetAngle = Math.atan2(head.y - e.clientY, head.x - e.clientX);
                    snake.forceSpeed = 12;
                }
            }
        });
    });

    // Spawn / Respawn Player Snake
    document.getElementById('spawnBtn').addEventListener('click', () => {
        if (playerSnake) {
            // Respawn existing snake to center
            playerSnake.reset();
            playerSnake.segments.forEach(s => { s.x = width/2; s.y = height/2; });
        } else {
            // Create new player snake
            playerSnake = new Snake(true);
            // Center spawn
            playerSnake.segments.forEach(s => { s.x = width/2; s.y = height/2; });
            snakes.push(playerSnake);
        }
    });

    // --- CLASSES ---

    class Food {
        constructor() { this.respawn(); }
        respawn() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = 3 + Math.random()*2;
            this.pulse = Math.random();
        }
        draw() {
            this.pulse += 0.05;
            const glowSize = 8 + Math.sin(this.pulse)*4;
            ctx.shadowBlur = glowSize; ctx.shadowColor = 'white';
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    class Snake {
      constructor(isPlayer = false) {
        this.isPlayer = isPlayer;
        this.reset();
        // AI random spawn positions
        if(!isPlayer) {
             this.segments.forEach(s => { s.x = Math.random() * width; s.y = Math.random() * height; });
        }
      }

      reset() {
        this.color = this.isPlayer ? PLAYER_COLOR : COLORS[Math.floor(Math.random() * COLORS.length)];
        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        this.baseSpeed = this.isPlayer ? 3 : (2 + Math.random());
        this.forceSpeed = 0;
        this.turnSpeed = 0.08;
        this.radius = this.isPlayer ? 8 : 5;
        this.length = 30 + Math.floor(Math.random() * 20);
        this.segments = [];
        for(let i=0; i<this.length; i++) { this.segments.push({x:0, y:0}); }
      }

      grow() { this.length += 10; }

      update(foodArray) {
        const head = this.segments[0];

        // --- MOVEMENT LOGIC ---
        if (this.isPlayer) {
            // PLAYER: Follow Mouse
            const dx = mouseX - head.x;
            const dy = mouseY - head.y;
            this.targetAngle = Math.atan2(dy, dx);
            
        } else {
            // AI: Scared or Hungry
            if (this.forceSpeed > 0) {
                this.forceSpeed *= 0.95; if(this.forceSpeed < 0.1) this.forceSpeed = 0;
            } else {
                // Seek nearest food
                let nearest = null; let minDst = 9999;
                foodArray.forEach(f => {
                    const d = Math.hypot(head.x - f.x, head.y - f.y);
                    if(d < minDst) { minDst = d; nearest = f; }
                });

                if(nearest && minDst < 250) {
                     this.targetAngle = Math.atan2(nearest.y - head.y, nearest.x - head.x);
                } else {
                     this.targetAngle += (Math.random() - 0.5) * 0.3; // Wander
                }
            }
        }

        // Smooth Rotation
        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * this.turnSpeed;

        // Apply Speed
        // Boost applies to everyone if mouse is held (global chaos) or just player? 
        // Let's make boost affect everyone for fun, or just player. 
        // Logic: if isPlayer, use isBoosting flag. If AI, only boost if scared.
        let boostMultiplier = (this.isPlayer && isBoosting) ? 2.5 : 1;
        
        let currentSpeed = (this.baseSpeed * boostMultiplier) + this.forceSpeed;
        
        let nextX = head.x + Math.cos(this.angle) * currentSpeed;
        let nextY = head.y + Math.sin(this.angle) * currentSpeed;

        // Wrap Screen
        if (nextX < 0) nextX = width; if (nextX > width) nextX = 0;
        if (nextY < 0) nextY = height; if (nextY > height) nextY = 0;

        this.segments.unshift({x: nextX, y: nextY});

        // Eat Food
        foodArray.forEach(f => {
            if(Math.hypot(head.x - f.x, head.y - f.y) < this.radius + f.size + 5) {
                f.respawn(); this.grow();
            }
        });

        if (this.segments.length > this.length) this.segments.pop();
      }

      draw() {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = this.radius * 2;
        // Stronger glow for player
        ctx.shadowBlur = this.isPlayer ? 30 : 15; 
        ctx.shadowColor = this.color; ctx.strokeStyle = this.color;

        ctx.beginPath();
        if(this.segments.length > 0) ctx.moveTo(this.segments[0].x, this.segments[0].y);
        
        for (let i = 1; i < this.segments.length; i++) {
          const curr = this.segments[i]; const prev = this.segments[i-1];
          if (Math.abs(curr.x - prev.x) + Math.abs(curr.y - prev.y) > 100) {
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(curr.x, curr.y);
          } else { ctx.lineTo(curr.x, curr.y); }
        }
        ctx.stroke(); 
        
        // Eyes
        ctx.shadowBlur = 0; const head = this.segments[0];
        // Player eyes always look at mouse (targetAngle). AI eyes look forward.
        let eyeAngle = this.targetAngle; 
        
        ctx.fillStyle = 'white';
        const lx = head.x + Math.cos(this.angle-0.7)*(this.radius*0.8); const ly = head.y + Math.sin(this.angle-0.7)*(this.radius*0.8);
        const rx = head.x + Math.cos(this.angle+0.7)*(this.radius*0.8); const ry = head.y + Math.sin(this.angle+0.7)*(this.radius*0.8);
        ctx.beginPath(); ctx.arc(lx, ly, this.radius*0.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(rx, ry, this.radius*0.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(lx + Math.cos(eyeAngle)*2, ly + Math.sin(eyeAngle)*2, this.radius*0.25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(rx + Math.cos(eyeAngle)*2, ry + Math.sin(eyeAngle)*2, this.radius*0.25, 0, Math.PI*2); ctx.fill();
      }
    }

    // Init Logic
    const snakes = Array.from({length: SNAKE_COUNT}, () => new Snake());
    const foods = Array.from({length: FOOD_COUNT}, () => new Food());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      foods.forEach(f => f.draw());
      snakes.forEach(s => { s.update(foods); s.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

  </script>
</body>
</html>
