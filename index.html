<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bad Vibes Socials</title>
  <meta name="theme-color" content="#0f0f0f">

  <meta property="og:image" content="./img/profile.png">
  <link rel="icon" type="image/x-icon" href="./img/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6RPDDNFTXY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6RPDDNFTXY');
  </script>

  <style>
    /* --- Base Variables --- */
    :root {
      --bg-color: #050505;
      --text-color: #ffffff;
      --card-bg: rgba(20, 20, 20, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --btn-bg: rgba(255, 255, 255, 0.05);
      --snake-color: #00f2ea;
      --snake-glow: #00f2ea;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden; /* Prevent scrolling, background covers all */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- Canvas Background (The Snake) --- */
    canvas#snake-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* --- Main Content --- */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      overflow-y: auto; /* Allow scrolling content inside */
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .link-card {
      width: 100%;
      max-width: 420px;
      margin-top: 2rem;
      margin-bottom: 5rem; /* Space for floating icon */
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      animation: slideUp 0.8s ease-out forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Header & Profile --- */
    .profile-wrapper {
      display: inline-block;
      padding: 4px;
      background: linear-gradient(135deg, #00f2ea, #ff0050);
      border-radius: 50%;
      margin-bottom: 1rem;
      transform-style: preserve-3d;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #111;
      display: block;
      transform: translateZ(20px);
    }

    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.2rem; }
    .bio { font-size: 0.95rem; color: rgba(255,255,255,0.6); margin-bottom: 2rem; }

    /* --- Links --- */
    .link-list { display: flex; flex-direction: column; gap: 1rem; }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.5rem;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .link-btn i { position: absolute; left: 24px; font-size: 1.3rem; }

    .link-btn:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.02);
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    /* Brand Colors on Hover */
    .fb:hover { border-color: #1877F2; box-shadow: 0 0 20px rgba(24, 119, 242, 0.4); }
    .yt:hover { border-color: #FF0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
    .ig:hover { border-color: #E1306C; box-shadow: 0 0 20px rgba(225, 48, 108, 0.4); }
    .tt:hover { border-color: #00f2ea; box-shadow: 0 0 20px rgba(0, 242, 234, 0.4); }

    /* --- Floating SVG Mascot --- */
    .floating-mascot {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      z-index: 100;
      cursor: pointer;
      filter: drop-shadow(0 0 10px rgba(0, 242, 234, 0.5));
      animation: floatMascot 3s ease-in-out infinite;
      transition: transform 0.3s;
    }

    .floating-mascot:hover {
      transform: scale(1.1) rotate(5deg);
    }

    /* The Float Animation */
    @keyframes floatMascot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* SVG Styling */
    .mascot-svg path {
      fill: #fff;
    }
    .mascot-svg .eyes {
      fill: #050505;
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      .link-card { padding: 2rem 1.5rem; }
      .floating-mascot { width: 50px; height: 50px; bottom: 15px; right: 15px; }
    }
  </style>
</head>
<body>

  <canvas id="snake-canvas"></canvas>

  <div class="floating-mascot" title="Bad Vibes Forever">
    <svg viewBox="0 0 512 512" class="mascot-svg" xmlns="http://www.w3.org/2000/svg">
      <path d="M256 48C141.1 48 48 141.1 48 256v208c0 17.7 14.3 32 32 32 10.3 0 19.9-4.8 26-13l46-61.3 46 61.3c6.1 8.2 15.7 13 26 13s19.9-4.8 26-13l46-61.3 46 61.3c6.1 8.2 15.7 13 26 13s19.9-4.8 26-13l46-61.3 46 61.3c6.1 8.2 15.7 13 26 13 17.7 0 32-14.3 32-32V256c0-114.9-93.1-208-208-208zm-64 192c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32zm128 0c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32z"/>
      <path class="eyes" d="M192 208c0 8.8-7.2 16-16 16s-16-7.2-16-16 7.2-16 16-16 16 7.2 16 16zm144 0c0 8.8-7.2 16-16 16s-16-7.2-16-16 7.2-16 16-16 16 7.2 16 16z"/>
    </svg>
  </div>

  <main>
    <div class="link-card" data-tilt data-tilt-max="5" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
      <header>
        <div class="profile-wrapper">
          <img src="./img/profile.png" alt="Profile" class="profile-img">
        </div>
        <h1>Bad Vibes</h1>
        <p class="bio">Digital Creator • Socials</p>
      </header>

      <div class="link-list">
        <a href="https://www.facebook.com/badvibeph/" target="_blank" class="link-btn fb">
          <i class="fa-brands fa-facebook-f"></i> Facebook
        </a>
        <a href="https://www.youtube.com/badvibesph/" target="_blank" class="link-btn yt">
          <i class="fa-brands fa-youtube"></i> YouTube
        </a>
        <a href="https://www.instagram.com/badvibesph/" target="_blank" class="link-btn ig">
          <i class="fa-brands fa-instagram"></i> Instagram
        </a>
        <a href="https://twitter.com/itsbadvibesph/" target="_blank" class="link-btn tw">
          <i class="fa-brands fa-x-twitter"></i> Twitter
        </a>
        <a href="https://www.tiktok.com/@itsbadvibes/" target="_blank" class="link-btn tt">
          <i class="fa-brands fa-tiktok"></i> TikTok
        </a>
      </div>

      <footer style="margin-top:2rem; font-size:0.8rem; opacity:0.6;">
        &copy; 2024 Bad Vibes.
      </footer>
    </div>
  </main>

  <script>
    /* --- Vanilla Tilt Init --- */
    VanillaTilt.init(document.querySelector(".link-card"));

    /* --- The Slither.io Snake Animation Script --- */
    const canvas = document.getElementById('snake-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // Snake settings
    const snake = {
      length: 60, // How long the snake is
      segments: [],
      radius: 8,
      speed: 3,
      angle: 0,
      targetAngle: 0,
      color: '#00f2ea'
    };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Initialize segments at center
    for (let i = 0; i < snake.length; i++) {
      snake.segments.push({ x: width / 2, y: height / 2 });
    }

    // AI Logic for smooth wandering
    function updateSnake() {
      // 1. Change angle slowly (Wander behavior)
      // Randomly adjust target angle slightly
      snake.targetAngle += (Math.random() - 0.5) * 0.3;
      
      // Smoothly rotate current angle towards target angle
      snake.angle += (snake.targetAngle - snake.angle) * 0.05;

      // 2. Move Head
      const head = snake.segments[0];
      const vx = Math.cos(snake.angle) * snake.speed;
      const vy = Math.sin(snake.angle) * snake.speed;

      let nextX = head.x + vx;
      let nextY = head.y + vy;

      // 3. Boundary Wrapping (Pacman style)
      if (nextX < 0) nextX = width;
      if (nextX > width) nextX = 0;
      if (nextY < 0) nextY = height;
      if (nextY > height) nextY = 0;

      // Add new head position to front of array
      snake.segments.unshift({ x: nextX, y: nextY });

      // Remove tail to maintain length
      if (snake.segments.length > snake.length) {
        snake.segments.pop();
      }
    }

    function drawSnake() {
      // Clear screen with slight trail effect (optional, currently full clear)
      ctx.clearRect(0, 0, width, height);

      // Draw Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = snake.color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Draw Body
      ctx.beginPath();
      // Start at head
      ctx.moveTo(snake.segments[0].x, snake.segments[0].y);

      // Draw curve through segments
      for (let i = 1; i < snake.segments.length - 1; i++) {
        const xc = (snake.segments[i].x + snake.segments[i + 1].x) / 2;
        const yc = (snake.segments[i].y + snake.segments[i + 1].y) / 2;
        
        // Handle wrapping visual glitches (don't draw line across screen)
        if (Math.abs(snake.segments[i].x - snake.segments[i+1].x) < 100 &&
            Math.abs(snake.segments[i].y - snake.segments[i+1].y) < 100) {
             ctx.quadraticCurveTo(snake.segments[i].x, snake.segments[i].y, xc, yc);
        } else {
             ctx.moveTo(xc, yc); // Skip the jump
        }
      }
      
      ctx.lineWidth = snake.radius * 2;
      ctx.strokeStyle = snake.color;
      ctx.stroke();

      // Draw Eyes on Head
      const head = snake.segments[0];
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(head.x + Math.cos(snake.angle + 1)*6, head.y + Math.sin(snake.angle + 1)*6, 3, 0, Math.PI * 2);
      ctx.arc(head.x + Math.cos(snake.angle - 1)*6, head.y + Math.sin(snake.angle - 1)*6, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function animate() {
      updateSnake();
      drawSnake();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
