<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Bad Vibes Socials</title>

  <meta name="description" content="Connect with Bad Vibes across all social platforms.">
  <meta property="og:image" content="/img/profile.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/x-icon" href="./img/icon.png">
  <meta name="theme-color" content="#0f0f0f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6639387700552171" crossorigin="anonymous"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6RPDDNFTXY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6RPDDNFTXY');
  </script>

  <style>
    /* --- CSS Variables & Reset --- */
    :root {
      --bg-color: #0f0f0f;
      --text-color: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --btn-bg: rgba(255, 255, 255, 0.12);
      --btn-hover: rgba(255, 255, 255, 0.25);
      --accent-glow: rgba(255, 255, 255, 0.4);
      /* Brand Colors for hovers */
      --fb-color: #1877F2;
      --yt-color: #FF0000;
      --ig-color: #E1306C;
      --x-color: #ffffff;
      --tt-color: #00f2ea;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- Floating SVG Background Layer --- */
    .bg-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      filter: blur(100px);
      opacity: 0.5;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    .shape-1 {
      top: -10%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: #4a1a63; /* Deep purple blob */
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      animation: float1 25s infinite;
    }

    .shape-2 {
      bottom: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: #1a3f63; /* Deep blue blob */
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      animation: float2 30s infinite;
    }

    @keyframes float1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(100px, 50px) rotate(45deg); }
    }
    
    @keyframes float2 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-100px, -80px) rotate(-30deg); }
    }


    /* --- Main Layout --- */
    main {
      width: 100%;
      padding: 2rem 1.5rem;
      display: flex;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* --- The Glass Card --- */
    .link-card {
      width: 100%;
      max-width: 460px; /* Optimal width for mobile/tablet */
      background: var(--card-bg);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    /* --- Profile Section --- */
    header {
      margin-bottom: 2.5rem;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card-border);
      margin-bottom: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }
    
    .profile-img:hover {
        transform: scale(1.03);
        border-color: var(--text-color);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .bio {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* --- Links Section --- */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem; /* Increased spacing between buttons */
      width: 100%;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      /* Keeps icon left, text center */
      justify-content: center; 
      padding: 1.1rem 1.5rem;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 50px; /* Pill shape */
      color: var(--text-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
    }

    /* Icon positioning */
    .link-btn i {
      position: absolute;
      left: 24px;
      font-size: 1.3rem;
      transition: transform 0.2s ease;
    }

    /* Hover effects */
    .link-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 10px 20px -10px rgba(0,0,0,0.3);
      border-color: var(--accent-glow);
    }
    
    .link-btn:active {
        transform: translateY(-1px) scale(0.99);
    }

    /* Brand color highlights on hover */
    .fb:hover { color: var(--fb-color); border-color: var(--fb-color); box-shadow: 0 8px 20px -10px var(--fb-color);}
    .yt:hover { color: var(--yt-color); border-color: var(--yt-color); box-shadow: 0 8px 20px -10px var(--yt-color);}
    .ig:hover { color: var(--ig-color); border-color: var(--ig-color); box-shadow: 0 8px 20px -10px var(--ig-color);}
    .tw:hover { color: var(--x-color); border-color: var(--x-color); box-shadow: 0 8px 20px -10px rgba(255,255,255,0.5);}
    .tt:hover { color: var(--tt-color); border-color: var(--tt-color); box-shadow: 0 8px 20px -10px var(--tt-color);}


    /* --- Footer --- */
    footer {
      margin-top: 3.5rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* --- Animations --- */
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* --- Mobile Adjustments --- */
    @media (max-width: 480px) {
      .link-card {
        padding: 2.5rem 1.5rem;
        border-radius: 24px;
      }
      .profile-img {
        width: 100px;
        height: 100px;
      }
      .link-btn {
        padding: 1rem 1.2rem;
        font-size: 1rem;
      }
      .link-btn i {
          left: 20px;
          font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>

  <div class="bg-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <main>
    <div class="link-card">
      <header>
        <img src="./img/profile.png" alt="Bad Vibes" class="profile-img">
        <h1>Bad Vibes</h1>
        <p class="bio">Socials & Content</p>
      </header>

      <div class="link-list">
        <a target="_blank" href="https://www.facebook.com/badvibeph/" class="link-btn fb">
          <i class="fa-brands fa-facebook-f"></i>
          Facebook
        </a>

        <a target="_blank" href="https://www.youtube.com/badvibesph/" class="link-btn yt">
          <i class="fa-brands fa-youtube"></i>
          YouTube
        </a>

        <a target="_blank" href="https://www.instagram.com/badvibesph/" class="link-btn ig">
          <i class="fa-brands fa-instagram"></i>
          Instagram
        </a>

        <a target="_blank" href="https://twitter.com/itsbadvibesph/" class="link-btn tw">
          <i class="fa-brands fa-x-twitter"></i>
          Twitter/X
        </a>

        <a target="_blank" href="https://www.tiktok.com/@itsbadvibes/" class="link-btn tt">
          <i class="fa-brands fa-tiktok"></i>
          TikTok
        </a>

      </div>

      <footer>
        <p>&copy; 2024 Bad Vibes. All rights reserved.</p>
      </footer>
    </div>
  </main>
</body>
</html>
