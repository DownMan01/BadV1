<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bad Vibes Socials</title>
  <meta name="theme-color" content="#000000">

  <meta property="og:image" content="./img/profile.png">
  <link rel="icon" type="image/x-icon" href="./img/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

  <style>
    /* --- CSS Reset & Variables --- */
    :root {
      --bg: #050505;
      --card-bg: rgba(20, 20, 20, 0.65); /* Darker, more opaque glass */
      --card-border: rgba(255, 255, 255, 0.1);
      --highlight: #ffffff;
      --accent: #00f2ea;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg);
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- Background Canvas --- */
    canvas#game-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      /* Subtle grid pattern overlay */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* --- Layout & Card --- */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }

    .glass-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Profile --- */
    .profile-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
    }

    .profile-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.1);
      position: relative;
      z-index: 2;
    }

    /* Glowing Ring behind profile */
    .ring {
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff0050, #00f2ea, #1877F2);
      z-index: 1;
      animation: spin 3s linear infinite;
      filter: blur(10px);
      opacity: 0.7;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.25rem;
      background: linear-gradient(to right, #fff, #999);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.role {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
    }

    /* --- Modern Link Buttons --- */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      padding: 18px 24px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .btn i {
      font-size: 1.4rem;
      width: 30px;
      text-align: center;
      margin-right: 15px;
      transition: transform 0.3s;
    }

    .btn span {
      position: relative;
      z-index: 2;
    }

    /* Hover States */
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 0%; height: 100%;
      background: rgba(255,255,255,0.1);
      transition: width 0.3s ease;
      z-index: 1;
    }

    .btn:hover::before { width: 100%; }
    .btn:hover { 
      transform: translateX(5px); 
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }
    .btn:hover i { transform: scale(1.2); }

    /* Specific Brand Accents on Hover */
    .fb:hover { border-color: #1877F2; box-shadow: 0 0 15px rgba(24,119,242,0.2); }
    .yt:hover { border-color: #FF0000; box-shadow: 0 0 15px rgba(255,0,0,0.2); }
    .ig:hover { border-color: #E1306C; box-shadow: 0 0 15px rgba(225,48,108,0.2); }
    .tt:hover { border-color: #00f2ea; box-shadow: 0 0 15px rgba(0,242,234,0.2); }

    /* --- Floating Badge --- */
    .status-badge {
      position: fixed;
      bottom: 30px; right: 30px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #333;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }
    .dot {
      width: 8px; height: 8px;
      background: #00ff00;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff00;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.5; } }

    @media(max-width: 480px) {
      .glass-card { padding: 2rem 1.5rem; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <main>
    <div class="glass-card" data-tilt data-tilt-max="3" data-tilt-glare data-tilt-max-glare="0.1">
      
      <div class="profile-container">
        <div class="ring"></div>
        <img src="./img/profile.png" alt="Profile" class="profile-img">
      </div>

      <h1>Bad Vibes</h1>
      <p class="role">Digital Creator</p>

      <div class="links">
        <a href="https://www.facebook.com/badvibeph/" target="_blank" class="btn fb">
          <i class="fa-brands fa-facebook-f"></i> <span>Facebook</span>
        </a>
        <a href="https://www.youtube.com/badvibesph/" target="_blank" class="btn yt">
          <i class="fa-brands fa-youtube"></i> <span>YouTube</span>
        </a>
        <a href="https://www.instagram.com/badvibesph/" target="_blank" class="btn ig">
          <i class="fa-brands fa-instagram"></i> <span>Instagram</span>
        </a>
        <a href="https://twitter.com/itsbadvibesph/" target="_blank" class="btn tw">
          <i class="fa-brands fa-x-twitter"></i> <span>Twitter</span>
        </a>
        <a href="https://www.tiktok.com/@itsbadvibes/" target="_blank" class="btn tt">
          <i class="fa-brands fa-tiktok"></i> <span>TikTok</span>
        </a>
      </div>

    </div>
  </main>

  <div class="status-badge">
    <div class="dot"></div>
    <span>Online</span>
  </div>

  <script>
    // --- 3D Tilt Init ---
    VanillaTilt.init(document.querySelector(".glass-card"), {
      speed: 400,
      gyroscope: true
    });

    // --- GAME ENGINE ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let mouseX = -1000;
    let mouseY = -1000;
    let isBoosting = false;

    // Slither.io Colors
    const colors = [
      '#00f2ea', // Cyan
      '#ff0050', // Neon Red
      '#adff02', // Lime
      '#bd00ff', // Purple
      '#ffae00'  // Orange
    ];

    // Resize Handler
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Interaction Listeners
    window.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    window.addEventListener('mousedown', () => isBoosting = true);
    window.addEventListener('mouseup', () => isBoosting = false);
    window.addEventListener('touchstart', () => isBoosting = true);
    window.addEventListener('touchend', () => isBoosting = false);

    // --- SNAKE CLASS ---
    class Snake {
      constructor() {
        this.reset();
        // Scatter start positions
        this.segments.forEach(s => {
            s.x = Math.random() * width;
            s.y = Math.random() * height;
        });
      }

      reset() {
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        this.baseSpeed = 2 + Math.random();
        this.turnSpeed = 0.05;
        this.radius = 6 + Math.random() * 4;
        this.length = 30 + Math.floor(Math.random() * 40);
        this.segments = [];
        for(let i=0; i<this.length; i++) {
          this.segments.push({x:0, y:0});
        }
      }

      update() {
        // AI: Wander randomly
        this.targetAngle += (Math.random() - 0.5) * 0.5;

        // AI: Avoid Mouse
        const head = this.segments[0];
        const dx = head.x - mouseX;
        const dy = head.y - mouseY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if(dist < 200) {
          // Calculate angle away from mouse
          const angleAway = Math.atan2(dy, dx);
          // Gently steer towards that angle
          this.targetAngle = angleAway;
        }

        // Smooth rotation
        // Minimal logic to handle angle wrapping (0 to 2PI)
        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * this.turnSpeed;

        // Move
        const speed = isBoosting ? this.baseSpeed * 2.5 : this.baseSpeed;
        const vx = Math.cos(this.angle) * speed;
        const vy = Math.sin(this.angle) * speed;

        let nextX = head.x + vx;
        let nextY = head.y + vy;

        // Wrap Screen (Pacman style)
        if (nextX < 0) nextX = width;
        if (nextX > width) nextX = 0;
        if (nextY < 0) nextY = height;
        if (nextY > height) nextY = 0;

        // Update Segments
        this.segments.unshift({x: nextX, y: nextY});
        if (this.segments.length > this.length) {
          this.segments.pop();
        }
      }

      draw() {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = this.radius * 2;
        
        // Shadow/Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.strokeStyle = this.color;

        ctx.beginPath();
        
        // Start at head
        if(this.segments.length > 0) {
            ctx.moveTo(this.segments[0].x, this.segments[0].y);
        }

        // Draw body
        for (let i = 1; i < this.segments.length; i++) {
          const curr = this.segments[i];
          const prev = this.segments[i-1];

          // STRETCH FIX:
          // If distance between points is too large, it means we wrapped screen.
          // Don't draw a line there. Start a new path.
          const dist = Math.abs(curr.x - prev.x) + Math.abs(curr.y - prev.y);
          
          if (dist > 100) {
            ctx.stroke(); // Draw what we have so far
            ctx.beginPath(); // Start new line
            ctx.moveTo(curr.x, curr.y);
          } else {
            // Smooth curve
            // Using straight lines for segment connectors is faster and looks fine for snakes
            ctx.lineTo(curr.x, curr.y);
          }
        }
        ctx.stroke();

        // Reset shadow for performance
        ctx.shadowBlur = 0;

        // Eyes (Cute factor)
        const head = this.segments[0];
        ctx.fillStyle = 'white';
        ctx.beginPath();
        // Left Eye
        ctx.arc(
          head.x + Math.cos(this.angle - 0.8) * (this.radius*0.6), 
          head.y + Math.sin(this.angle - 0.8) * (this.radius*0.6), 
          this.radius * 0.4, 0, Math.PI*2
        );
        // Right Eye
        ctx.arc(
          head.x + Math.cos(this.angle + 0.8) * (this.radius*0.6), 
          head.y + Math.sin(this.angle + 0.8) * (this.radius*0.6), 
          this.radius * 0.4, 0, Math.PI*2
        );
        ctx.fill();
      }
    }

    // --- INIT ---
    const snakes = [];
    const SNAKE_COUNT = 8; // Multiple snakes

    for(let i=0; i<SNAKE_COUNT; i++) {
      snakes.push(new Snake());
    }

    // --- ANIMATION LOOP ---
    function animate() {
      // Clear with slight fade for trail effect? No, clean clear looks more modern for this style.
      ctx.clearRect(0, 0, width, height);

      snakes.forEach(snake => {
        snake.update();
        snake.draw();
      });

      requestAnimationFrame(animate);
    }
    animate();

  </script>
</body>
</html>
